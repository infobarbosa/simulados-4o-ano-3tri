<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Testes do motor</title>
  <style>body{font:16px system-ui;padding:1rem}li.ok{color:#2a7d00}li.erro{color:#b00020;font-weight:700}</style>
</head>
<body>
  <h1>Testes do motor</h1>
  <p>Abra esta página por um servidor local (<code>python3 -m http.server</code> na raiz do projeto, depois <code>/tests/</code>). O título da aba mostra "OK n/n".</p>
  <ul id="lista"></ul>
  <script type="module">
    import * as M from "../js/motor.js";
    import { sortearCarta } from "../js/cartas.js";
    const catalogo = await (await fetch("../conteudo/catalogo.json")).json();
    const lista = document.getElementById("lista");
    let falhas = 0, total = 0;
    const igual = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || ""} esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`); };
    const ok = (c, msg) => { if (!c) throw new Error(msg || "condição falsa"); };
    function teste(nome, fn) {
      total++;
      const li = document.createElement("li");
      try { fn(); li.className = "ok"; li.textContent = "✓ " + nome; }
      catch (e) { falhas++; li.className = "erro"; li.textContent = `✗ ${nome}: ${e.message}`; }
      lista.append(li);
    }
    const lac = (resp, gab) => M.corrigirLacuna(resp, gab);

    // todos os simulados do catálogo são válidos
    const todos = [];
    for (const s of catalogo) todos.push(await (await fetch(`../conteudo/${s.id}.json`)).json());
    teste("catálogo tem 41 simulados de 27 questões, todos válidos", () => {
      igual(todos.length, 41);
      for (const s of todos) { igual(s.questoes.length, 27, s.id); igual(M.validar(s), [], s.id); }
    });

    teste("lacuna: maiúsculas, espaços e pontuação final não importam", () => {
      igual(lac("  Rio Grande. ", "rio grande"), { pontos: 1, aviso: null });
      igual(lac("", "x").pontos, 0);
      igual(lac("errado", "certo").pontos, 0);
    });
    teste("lacuna: só o acento difere → vale, com aviso", () => igual(lac("caes", "cães"), { pontos: 1, aviso: "acento" }));
    teste("lacuna: números equivalentes", () => {
      igual(lac("1500", "1.500"), { pontos: 1, aviso: null });
      igual(lac("0,5", "1/2"), { pontos: 1, aviso: "equivalente" });
      igual(lac("3/6", "1/2"), { pontos: 1, aviso: "equivalente" });
      igual(lac("2/3", "1/2").pontos, 0);
    });

    const vf = { n: 1, tipo: "vf", resposta: "V" };
    const mc = { n: 2, tipo: "multipla", resposta: "B", alternativas: [{ id: "A", texto: "a" }, { id: "B", texto: "b" }, { id: "C", texto: "c" }] };
    const assoc = { n: 3, tipo: "associacao", colunaA: [{ id: "1", texto: "x" }, { id: "2", texto: "y" }, { id: "3", texto: "z" }, { id: "4", texto: "w" }],
      colunaB: [{ id: "a", texto: "T1" }, { id: "b", texto: "T2" }, { id: "c", texto: "T1" }, { id: "d", texto: "T4" }], resposta: { 1: "a", 2: "b", 3: "c", 4: "d" } };
    teste("V/F e múltipla escolha", () => {
      ok(M.corrigir(vf, "V").correta && !M.corrigir(vf, "F").correta);
      ok(M.corrigir(mc, "B").correta && !M.corrigir(mc, "A").correta);
    });
    teste("associação: pontos parciais e itens da Coluna B com o mesmo texto são equivalentes", () => {
      igual(M.corrigir(assoc, { 1: "a", 2: "b", 3: "c", 4: "d" }).pontos, 1);
      igual(M.corrigir(assoc, { 1: "c", 2: "b", 3: "a", 4: "d" }).pontos, 1); // a e c têm o mesmo texto
      igual(M.corrigir(assoc, { 1: "a", 2: "b", 3: "c", 4: "a" }).pontos, 0.75);
      igual(M.corrigir(assoc, {}).pontos, 0);
    });
    teste("sortearOrdem é determinística e não perde itens", () => {
      const a = M.sortearOrdem([mc, assoc], 42), b = M.sortearOrdem([mc, assoc], 42);
      igual(a, b);
      igual([...a[2]].sort(), ["A", "B", "C"]);
      igual([...a[3]].sort(), ["a", "b", "c", "d"]);
    });
    teste("questaoParaAluno esconde o gabarito e aplica a ordem", () => {
      const q = M.questaoParaAluno(mc, { 2: ["C", "A", "B"] });
      ok(!("resposta" in q)); igual(q.alternativas.map((x) => x.id), ["C", "A", "B"]);
    });
    teste("gabaritoParaExibir", () => {
      igual(M.gabaritoParaExibir(mc), { valor: "B", texto: "b" });
      igual(M.gabaritoParaExibir(assoc).pares[3], "T1");
    });
    teste("estrelas e raridade por nota", () => {
      igual([null, 5, 7, 8.9, 9, 10].map(M.estrelasPorNota), [0, 1, 2, 2, 3, 3]);
      igual([6.9, 7, 9].map((n) => sortearCarta("Geografia", n, 1).raridade), ["comum", "rara", "lendaria"]);
    });
    teste("carta: tipo pela disciplina, determinística pela semente", () => {
      igual(sortearCarta("Matemática", 10, 7), sortearCarta("Matemática", 10, 7));
      igual(sortearCarta("Matemática", 10, 7).elemento, "raio");
      igual(sortearCarta("Bilíngue", 8, 7).elemento, "vento");
    });

    teste("contexto: 11 questões de Frações trazem a receita ou o suco, com itens, e o gabarito segue escondido", () => {
      const comCtx = todos.flatMap((s) => s.questoes.filter((q) => q.contexto));
      igual(comCtx.length, 11);
      for (const q of comCtx) {
        ok(q.contexto.titulo && q.contexto.itens.length >= 1, `questão ${q.n}`);
        const aluno = M.questaoParaAluno(q, {});
        ok(!("resposta" in aluno) && aluno.contexto.titulo === q.contexto.titulo, `questão ${q.n}`);
      }
      igual([...new Set(comCtx.map((q) => q.contexto.titulo))].sort(), ["Receita de pão de queijo", "Suco de laranja"]);
    });

    // ---- figuras e questões de pintar (só existem neste app; o correcao.py do simulados-vitor não tem) ----
    const pint = { n: 9, tipo: "pintar", resposta: 3, figura: { tipo: "barra", partes: 8 } };
    teste("pintar: vale a quantidade de partes pintadas, não quais", () => {
      ok(M.corrigir(pint, [0, 1, 2]).correta, "três primeiras");
      ok(M.corrigir(pint, [5, 6, 7]).correta, "três últimas");
      ok(M.corrigir(pint, [1, 4, 7]).correta, "três espalhadas");
      igual(M.corrigir(pint, [0, 1]).pontos, 0);
      igual(M.corrigir(pint, []).pontos, 0);
      igual(M.corrigir(pint, null).pontos, 0);
      igual(M.gabaritoParaExibir(pint), { valor: 3, texto: "3 de 8 partes" });
    });
    teste("validar pega figura de pintar com a resposta desenhada ou fora do tamanho", () => {
      igual(M.validar({ questoes: [pint] }), []);
      ok(M.validar({ questoes: [{ ...pint, figura: { tipo: "barra", partes: 8, pintadas: 3 } }] }).length === 1);
      ok(M.validar({ questoes: [{ ...pint, resposta: 9 }] }).length === 1);
      ok(M.validar({ questoes: [{ ...pint, figura: { tipo: "barra" } }] }).length === 1);
    });

    import { descreverFigura, figuraEl, figuraInterativa } from "../js/figuras.js";
    const figurasDoCatalogo = todos.flatMap((s) => s.questoes.flatMap((q) =>
      [q.figura, ...(q.colunaA || []).map((a) => a.figura)].filter(Boolean).map((f) => ({ q, s, f }))));
    teste("as figuras do conteúdo são coerentes, desenháveis e descritas em texto", () => {
      ok(figurasDoCatalogo.length >= 20, `só ${figurasDoCatalogo.length} figuras`);
      for (const { q, s, f } of figurasDoCatalogo) {
        const onde = `${s.id} q${q.n}`;
        for (const g of f.figuras || [f]) {
          if (g.tipo === "barra" || g.tipo === "circulo") {
            ok(g.partes >= 2, onde);
            if (g.pintadas !== undefined) ok(g.pintadas >= 0 && g.pintadas <= g.partes, onde);
          }
          if (g.tipo === "reta") ok(g.marca >= 0 && g.marca <= g.partes, onde);
          if (g.tipo === "colecao") ok(g.destacados >= 0 && g.destacados <= g.itens, onde);
        }
        ok(descreverFigura(f).length > 10, `${onde} sem descrição`);
        ok(figuraEl(f), `${onde} não desenhou`);
      }
    });
    teste("figura de pintar começa vazia e conta as partes que a criança toca", () => {
      let avisos = 0;
      const area = figuraInterativa({ tipo: "barra", partes: 6 }, () => avisos++);
      igual(area.el.querySelectorAll(".parte.pintada").length, 0);
      const partes = area.el.querySelectorAll(".parte");
      partes[0].dispatchEvent(new MouseEvent("click"));
      partes[4].dispatchEvent(new MouseEvent("click"));
      igual(area.pintadas(), [0, 4]);
      partes[0].dispatchEvent(new MouseEvent("click"));
      igual(area.pintadas(), [4]);
      igual(avisos, 3);
      area.travar();
      partes[2].dispatchEvent(new MouseEvent("click"));
      igual(area.pintadas(), [4], "travada não pinta mais");
    });
    teste("todo simulado novo (4 e 5) tem as 3 questões de pintar ou nenhuma", () => {
      for (const s of todos) {
        const n = s.questoes.filter((q) => q.tipo === "pintar").length;
        ok(n === 0 || n === 3, `${s.id} tem ${n}`);
        if (n) igual(s.partes["5"] ? 1 : 0, 1, `${s.id} sem a Parte 5`);
      }
    });

    // mini-aulas do botão "Ler o conteúdo": todo campo "ajuda" tem tópico, e todo tópico serve a alguma questão
    const materias = new Map();
    for (const s of todos) {
      if (s.materia && !materias.has(s.materia)) {
        materias.set(s.materia, await (await fetch(`../conteudo/materia/${s.materia}.json`)).json());
      }
    }
    teste("conteúdo de apoio: todo campo \"ajuda\" aponta um tópico que existe", () => {
      ok(materias.size >= 1, "nenhum simulado com matéria");
      for (const s of todos) {
        for (const q of s.questoes) {
          if (!q.ajuda) continue;
          ok(s.materia, `${s.id} q${q.n} tem ajuda mas o simulado não tem materia`);
          ok(materias.get(s.materia).topicos[q.ajuda], `${s.id} q${q.n}: tópico ${q.ajuda} não existe`);
        }
      }
    });
    teste("conteúdo de apoio: tópicos bem formados e todos usados", () => {
      const usados = new Set(todos.flatMap((s) => s.questoes.map((q) => s.materia && q.ajuda ? `${s.materia}/${q.ajuda}` : null)));
      for (const [arquivo, m] of materias) {
        for (const [chave, t] of Object.entries(m.topicos)) {
          ok(t.titulo && Array.isArray(t.blocos) && t.blocos.length, `${arquivo}/${chave} sem título ou blocos`);
          for (const b of t.blocos) {
            if (b.tipo === "lista") ok(b.itens?.length, `${arquivo}/${chave}: lista vazia`);
            else if (b.tipo === "exemplos") ok(b.itens?.every((i) => i.frase), `${arquivo}/${chave}: exemplo sem frase`);
            else if (b.tipo === "tabela") ok(b.colunas?.length && b.linhas?.every((l) => l.length === b.colunas.length), `${arquivo}/${chave}: tabela torta`);
            else ok(b.texto, `${arquivo}/${chave}: bloco ${b.tipo} sem texto`);
          }
          ok(usados.has(`${arquivo}/${chave}`), `${arquivo}/${chave} não é usado por nenhuma questão`);
        }
      }
    });

    import * as T from "../js/termos.js";
    teste("termos de uso: versão, 9 cláusulas essenciais e resumo, sem marcadores soltos", () => {
      ok(Number.isInteger(T.VERSAO_TERMOS) && T.VERSAO_TERMOS >= 1);
      igual(T.ARTIGOS.length, 9);
      const titulos = T.ARTIGOS.map((a) => a[0]);
      for (const t of ["Sem garantias", "Pode haver enganos", "Pode mudar ou acabar", "Seus dados", "Responsabilidade"]) ok(titulos.includes(t), t);
      ok(T.ARTIGOS.every(([t, x]) => t && x.length > 20 && !x.includes("__")), "texto com marcador solto");
      igual(T.resumoEl().children.length, 4);
    });

    document.title = falhas ? `FALHOU ${falhas}/${total}` : `OK ${total}/${total}`;
    document.querySelector("h1").textContent += ` — ${document.title}`;
  </script>
</body>
</html>
